name: Social Autopilot

on:
  schedule:
    - cron: "*/30 7-22 * * *"   # every 30 min during the day: publish due posts
    - cron: "47 6 1 * *"        # 1st of the month: report
  workflow_dispatch:
    inputs:
      job:
        description: "daily | monthly | print"
        default: "daily"

permissions:
  contents: write

concurrency: autopilot          # never two runs at once (no double posts)

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
      GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
      GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
      GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Pick job
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then echo "job=${{ github.event.inputs.job }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "47 6 1 * *" ]; then echo "job=monthly" >> $GITHUB_OUTPUT
          else echo "job=daily" >> $GITHUB_OUTPUT; fi

      - run: python run.py ${{ steps.pick.outputs.job }}

      - name: Save state, review posts, print files
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          for p in state.json content print docs; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if ! git diff --cached --quiet; then git commit -m "autopilot: update" && git push; fi
